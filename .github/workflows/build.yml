name: build-linux

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      # Skip the OpenCV screen-capture feature. CI has no OpenCV and
      # capture.cpp includes <Windows.h> which is not portable to Linux.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5 + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev qtbase5-dev-tools \
            qttools5-dev-tools \
            qtsvg5-dev qt5-image-formats-plugins \
            libqt5sql5-sqlite \
            make g++ pkg-config

      - name: Verify toolchain
        run: |
          qmake -query QT_VERSION
          qmake -query QT_INSTALL_PREFIX
          g++ --version | head -1
          make --version | head -1

      - name: Generate Makefiles
        working-directory: ${{ github.workspace }}
        run: qmake cutechess.pro "CONFIG+=no_capture"

      - name: Build (lib + gui + cli)
        working-directory: ${{ github.workspace }}
        run: make -j"$(nproc)"

      - name: Collect build outputs
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p artifacts
          cp -v projects/lib/libcutechess.a     artifacts/ || echo "lib artifact not found"
          cp -v projects/gui/cutechess          artifacts/ || echo "gui artifact not found"
          cp -v projects/cli/cutechess-cli      artifacts/ || echo "cli artifact not found"
          ls -la artifacts

      - name: Package artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutechess-linux-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Smoke test (cutechess-cli --help)
        working-directory: ${{ github.workspace }}
        run: |
          ./projects/cli/cutechess-cli --help | head -20
          test -x ./projects/cli/cutechess-cli
          test -x ./projects/gui/cutechess
